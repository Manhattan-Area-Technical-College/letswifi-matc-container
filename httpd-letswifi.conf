# ── HTTP vhost (default: TLS terminates at your reverse proxy) ─────────────────
# HTTPS/mTLS is handled by letswifi-ssl.conf, written by entrypoint.sh when the
# TLS certs are present. See install.md.
<VirtualHost *:80>
    ServerName       ${LETSWIFI_FQDN}
    DocumentRoot     /usr/local/share/letswifi-portal/htdocs
    Alias /simplesaml /usr/local/share/simplesamlphp/public
    Alias /crl        /var/www/letswifi-crl

    SetEnv SIMPLESAMLPHP_CONFIG_DIR /etc/simplesamlphp
    SetEnv LETSWIFI_CONFIG_DIR      /etc/letswifi

    Header always set Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none';"
    Header always set Referrer-Policy         "no-referrer"
    Header always set X-Frame-Options         "DENY"
    Header always set X-Content-Type-Options  "nosniff"

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    </FilesMatch>

    <Directory /usr/local/share/letswifi-portal/htdocs>
        Require all granted
    </Directory>
    <Directory /usr/local/share/simplesamlphp/public>
        Require all granted
    </Directory>
    <Directory /var/www/letswifi-crl>
        Require all granted
        Options -Indexes
    </Directory>
</VirtualHost>
